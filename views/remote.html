<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!--BRAND_HEAD:Télécommande-->
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height: 100dvh; }
    .rc { max-width: 520px; margin: 0 auto; padding: 12px 12px 90px; display: grid; gap: 12px; }
    .rc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .rc-head h1 { margin: 0; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rc-card { background: var(--surface); color: var(--text); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); display: grid; gap: 6px; }
    .rc-card .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-weight: 900; }
    .rc-card .big-title { font-size: 22px; font-weight: 900; line-height: 1.15; }
    .rc-card .answer { background: #d9f7e8; color: #0b5d3a; border-radius: 8px; padding: 6px 10px; font-weight: 900; }
    .rc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .rc-stats div { background: rgba(0,0,0,.25); border-radius: 10px; padding: 8px; text-align: center; font-weight: 900; }
    .rc-stats b { display: block; font-size: 22px; }
    .rc-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rc-buttons button { min-height: 64px; font-size: 17px; }
    .rc-buttons .wide { grid-column: 1 / -1; min-height: 76px; font-size: 20px; }
    .rc-buttons button.warn { background: var(--bad); color: #fff; }
    .phase { font-weight: 900; }
    .secret-note { font-size: 12px; color: var(--on-bg-muted); text-align: center; margin: 0; }
    #pair-form input { text-transform: uppercase; letter-spacing: 3px; }
    .amb { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--surface-2); padding-top: 6px; }
    .amb button { min-height: 44px; }
  </style>
</head>
<body>
  <main class="rc">
    <section id="s-pair" data-screen class="hidden">
      <h1 class="logo" style="font-size:28px">{{logo}}</h1>
      <form class="card stack" id="pair-form" autocomplete="off" style="margin:0 auto">
        <h2 style="margin:0">Télécommande animateur</h2>
        <p class="sub" style="margin:0">Scannez le QR code « Télécommande » affiché sur l’écran animateur, ou saisissez le code.</p>
        <input id="pair-pin" inputmode="numeric" maxlength="6" placeholder="PIN de la partie" aria-label="PIN de la partie" required>
        <input id="pair-code" maxlength="12" placeholder="Code (8 caractères)" aria-label="Code d’association" required>
        <button class="accent" type="submit">Associer ce téléphone</button>
        <button class="ghost hidden" type="button" id="btn-admin-pair" style="color:var(--text)">Ouvrir avec ma session administrateur</button>
        <p class="error" id="pair-err" role="alert"></p>
      </form>
    </section>

    <section id="s-remote" data-screen class="hidden">
      <div class="rc-head">
        <h1 id="r-title"></h1>
        <span class="status-pill live" id="r-live">Connecté</span>
      </div>
      <div class="rc-head"><span class="phase" id="r-phase"></span><span id="r-flow" class="sub" style="color:var(--on-bg-muted)"></span></div>
      <div class="rc-stats">
        <div><b id="r-answers">0</b>réponses</div>
        <div><b id="r-players">0</b>connectés</div>
        <div><b id="r-time">–</b>restant</div>
      </div>
      <div class="rc-card" id="r-current"></div>
      <div class="rc-card hidden" id="r-ambiguous"></div>
      <div class="rc-card" id="r-next"></div>
      <div class="rc-card"><span class="lbl">Audio (écran animateur)</span><span id="r-audio">—</span></div>
      <div class="rc-buttons" id="r-buttons"></div>
      <label class="rc-card" style="gap:4px"><span class="lbl">Enchaînement</span>
        <select id="r-flow-select"><option value="">Selon le blind test</option><option value="manual">Manuel</option><option value="semi-auto">Semi-automatique</option><option value="automatic">Automatique</option></select>
      </label>
      <p class="secret-note">🔒 Les réponses affichées ici ne sont visibles que sur cette télécommande.</p>
    </section>
    <section id="s-msg" data-screen class="center hidden"><p class="big" id="m-text"></p></section>
  </main>
  <script type="module" src="/remote.js"></script>
</body>
</html>
